<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 760" width="100%" height="100%">
  <style>
    .tit-d { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
    .sub-d { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #64748B; letter-spacing: 1px; }
    .day-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #F8FAFC; }
    .day-meta { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
  </style>

  <!-- Marco Celular -->
  <rect width="350" height="760" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  
  <!-- HEADER -->
  <g transform="translate(24, 46)">
    <text x="0" y="20" fill="#64748B" font-size="18" font-weight="bold" cursor="pointer">←</text>
    <text x="32" y="18" class="tit-d">Estructura (2/2)</text>
    <text x="302" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="end">Finalizar</text>
  </g>

  <text x="24" y="114" class="sub-d">🗓️ DÍAS DE ENTRENAMIENTO</text>

  <!-- Día 1 Agregado -->
  <g transform="translate(24, 128)">
    <rect width="302" height="60" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="26" class="day-title">Día 1: Tren Superior + Zona Media</text>
    <text x="16" y="44" class="day-meta">1 bloque armado • Editar</text>
    <text x="286" y="35" fill="#64748B" font-size="14" text-anchor="end">☰</text> <!-- Icono Reorder -->
  </g>

  <!-- Día 2 Agregado -->
  <g transform="translate(24, 200)">
    <rect width="302" height="60" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="26" class="day-title">Día 2: Full Body</text>
    <text x="16" y="44" class="day-meta">Vacío • Toca para diseñar</text>
    <text x="286" y="35" fill="#64748B" font-size="14" text-anchor="end">☰</text>
  </g>

  <!-- BOTÓN: AGREGAR NUEVO DÍA EN BLANCO -->
  <g transform="translate(24, 272)">
    <rect width="302" height="48" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="151" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">+ Añadir otro Día</text>
  </g>
</svg>
