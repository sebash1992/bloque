    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #F8FAFC; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748B; }
    .nav-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; text-anchor: middle; }
    .nav-txt-active { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #10B981; text-anchor: middle; }
    .badge-txt { font-family: monospace; font-size: 10px; fill: #94A3B8; text-anchor: middle; }
  </style>

  <g transform="translate(40, 24)">
    <rect width="350" height="760" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    
