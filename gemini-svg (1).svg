<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <style>
    .titulo { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #CBD5E1; letter-spacing: 0.5px; }
