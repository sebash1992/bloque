      <text x="16" y="52" class="card-desc">Frecuencia: 3 veces x sem + Bonus Track</text>
      <rect x="16" y="60" width="85" height="16" rx="4" fill="#10B981" opacity="0.1"/>
      <text x="22" y="72" font-family="sans-serif" font-size="9" font-weight="bold" fill="#10B981">EN PROGRESO</text>
