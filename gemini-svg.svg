<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <!-- Fondo de la Pantalla del Celular (Modo Oscuro) -->
  <rect width="375" height="812" rx="40" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  
  <!-- BARRA SUPERIOR (HEADER) -->
  <!-- Botón Atrás -->
  <text x="24" y="52" fill="#64748B" font-family="sans-serif" font-size="20" font-weight="bold" cursor="pointer">←</text>
  <!-- Título del Día -->
  <text x="187" y="50" fill="#CBD5E1" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.5">DÍA 1: TREN SUPERIOR</text>
  <!-- Porcentaje -->
  <text x="351" y="50" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">58%</text>
  
  <!-- Barra de Progreso Global -->
  <rect x="24" y="66" width="327" height="4" rx="2" fill="#1E293B"/>
  <rect x="24" y="66" width="190" height="4" rx="2" fill="#10B981"/>
  
  <!-- Título del Bloque -->
  <text x="24" y="102" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">📦 BLOQUE 1</text>
  
  <!-- ==================== CARD 1: PRESS PLANO (EN PROGRESO) ==================== -->
  <g transform="translate(24, 118)">
    <!-- Fondo Card -->
    <rect width="327" height="156" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Info Ejercicio -->
    <text x="16" y="28" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">🏋️ Press plano c/barra</text>
    <text x="16" y="46" fill="#64748B" font-family="sans-serif" font-size="11">⏱️ Último: 70kg / 75kg / 80kg / 82kg</text>
    <!-- Badge de Series/Reps -->
    <rect x="231" y="14" width="80" height="22" rx="6" fill="#0F172A"/>
    <text x="271" y="29" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">4S | 10-8-6-4</text>
    
    <!-- SUB-COMPONENTE: SERIES (BOTONES INTERACTIVOS) -->
    <!-- Serie 1 (Completada) -->
    <rect x="16" y="66" width="65" height="40" rx="10" fill="#10B981"/>
    <text x="48" y="84" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">10</text>
    <text x="48" y="96" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" opacity="0.8">70kg</text>
    
    <!-- Serie 2 (Completada) -->
    <rect x="91" y="66" width="65" height="40" rx="10" fill="#10B981"/>
    <text x="123" y="84" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">8</text>
    <text x="123" y="96" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" opacity="0.8">75kg</text>
    
    <!-- Serie 3 (Activa / Focus) -->
    <rect x="166" y="66" width="65" height="40" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="198" y="84" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="198" y="96" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">80kg</text>
    
    <!-- Serie 4 (Pendiente) -->
    <rect x="241" y="66" width="65" height="40" rx="10" fill="#0F172A"/>
    <text x="273" y="84" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="medium" text-anchor="middle">4</text>
    <text x="273" y="96" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle" opacity="0.6">82kg</text>
    
    <!-- Botón Inferior Modificar -->
    <rect x="16" y="118" width="295" height="26" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="164" y="134" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="medium" text-anchor="middle">⚖️ Modificar peso o repeticiones</text>
  </g>

  <!-- ==================== CARD 2: BICHO MUERTO (COMPLETADA) ==================== -->
  <g transform="translate(24, 290)" opacity="0.5">
    <!-- Fondo Card Completada con borde verde entero -->
    <rect width="327" height="74" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="32" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">✓ 🪱 Bicho muerto</text>
    <text x="16" y="52" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="semibold">🟢 Series completadas: 4 / 4</text>
    <rect x="251" y="16" width="60" height="22" rx="6" fill="#0F172A"/>
    <text x="281" y="30" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">4S | 12</text>
  </g>

  <!-- ==================== CARD 3: BICEP CONCENTRADO (PENDIENTE) ==================== -->
  <g transform="translate(24, 380)">
    <!-- Fondo Card Inactiva -->
    <rect width="327" height="74" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="32" fill="#94A3B8" font-family="sans-serif" font-size="15" font-weight="medium">💪 Bicep concentrado</text>
    <text x="16" y="52" fill="#64748B" font-family="sans-serif" font-size="11">Sugerido hoy: 12.5 kg</text>
    <rect x="251" y="16" width="60" height="22" rx="6" fill="#0F172A"/>
    <text x="281" y="30" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">4S | 8/8</text>
  </g>
  
  <!-- Título del Bloque 2 -->
  <text x="24" y="484" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">📦 BLOQUE 2 (BLOQUEADO)</text>

  <!-- ==================== BARRA DE NAVEGACIÓN INFERIOR ==================== -->
  <g transform="translate(0, 742)">
    <!-- Línea divisoria superior -->
    <line x1="0" y1="0" x2="375" y2="0" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Tab 1: Inicio -->
    <text x="62" y="26" text-anchor="middle" font-size="18">🏠</text>
    <text x="62" y="42" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="medium" text-anchor="middle">Inicio</text>
    
    <!-- Tab 2: Mi Rutina (Activo) -->
    <text x="187" y="26" text-anchor="middle" font-size="18">🏋️</text>
    <text x="187" y="42" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Mi Rutina</text>
    
    <!-- Tab 3: Progreso -->
    <text x="312" y="26" text-anchor="middle" font-size="18">📊</text>
    <text x="312" y="42" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="medium" text-anchor="middle">Progreso</text>
  </g>
</svg>
