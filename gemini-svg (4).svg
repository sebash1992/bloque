<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 760" width="100%" height="100%">
  <style>
    .titulo-g { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .sub-g { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #64748B; letter-spacing: 1px; }
    .chip-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .eje-txt { font-family: monospace; font-size: 9px; fill: #475569; }
    .hist-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #E2E8F0; }
  </style>

  <rect width="350" height="760" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  
  <g transform="translate(24, 46)">
    <text x="0" y="20" fill="#64748B" font-size="18" font-weight="bold" cursor="pointer">←</text>
    <text x="32" y="18" class="titulo-g">Press plano c/barra</text>
  </g>

  <g transform="translate(24, 94)">
    <rect x="0" y="0" width="64" height="26" rx="13" fill="#1E293B"/>
    <text x="32" y="16" class="chip-txt" fill="#64748B">12 reps</text>
    
    <rect x="72" y="0" width="64" height="26" rx="13" fill="#1E293B"/>
    <text x="104" y="16" class="chip-txt" fill="#64748B">10 reps</text>
    
    <rect x="144" y="0" width="64" height="26" rx="13" fill="#10B981"/>
    <text x="176" y="16" class="chip-txt" fill="#0F172A">8 reps</text>
    
    <rect x="216" y="0" width="64" height="26" rx="13" fill="#1E293B"/>
    <text x="248" y="16" class="chip-txt" fill="#64748B">6 reps</text>
  </g>

  <g transform="translate(24, 146)">
    <rect width="302" height="180" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <line x1="40" y1="30" x2="280" y2="30" stroke="#334155" stroke-dasharray="3"/>
    <text x="16" y="33" class="eje-txt">80 kg</text>
    
    <line x1="40" y1="80" x2="280" y2="80" stroke="#334155" stroke-dasharray="3"/>
    <text x="16" y="83" class="eje-txt">75 kg</text>
    
    <line x1="40" y1="130" x2="280" y2="130" stroke="#334155" stroke-dasharray="3"/>
    <text x="16" y="133" class="eje-txt">70 kg</text>
    
    <line x1="40" y1="150" x2="280" y2="150" stroke="#475569" stroke-width="1"/>
    <text x="50" y="166" class="eje-txt" text-anchor="middle">29/06</text>
    <text x="160" y="166" class="eje-txt" text-anchor="middle">06/07</text>
    <text x="270" y="166" class="eje-txt" text-anchor="middle">13/07</text>
    
    <path d="M 50 130 L 160 80 L 270 30" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="50" cy="130" r="4" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/>
    <circle cx="160" cy="80" r="4" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/>
    <circle cx="270" cy="30" r="5" fill="#F8FAFC" stroke="#10B981" stroke-width="3"/>
  </g>

  <text x="24" y="356" class="sub-g">📋 HISTORIAL PARA 8 REPS</text>
  
  <g transform="translate(24, 372)">
    <rect width="302" height="44" rx="10" fill="#1E293B"/>
    <text x="16" y="26" class="hist-title">13/07/2026</text>
    <text x="286" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="end">75.0 kg</text>
    
    <rect y="54" width="302" height="44" rx="10" fill="#1E293B"/>
    <text x="16" y="80" class="hist-title">06/07/2026</text>
    <text x="286" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94A3B8" text-anchor="end">75.0 kg</text>
    
    <rect y="108" width="302" height="44" rx="10" fill="#1E293B"/>
    <text x="16" y="134" class="hist-title">29/06/2026</text>
    <text x="286" y="134" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748B" text-anchor="end">70.0 kg</text>
  </g>

  <g transform="translate(0, 700)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="58" y="24" font-size="16">🏠</text><text x="58" y="38" class="nav-txt-p">Inicio</text>
    <text x="175" y="24" font-size="16">🏋️</text><text x="175" y="38" class="nav-txt-p">Mi Rutina</text>
    <text x="292" y="24" font-size="16">📊</text><text x="292" y="38" class="nav-txt-active-p">Progreso</text>
  </g>
</svg>
