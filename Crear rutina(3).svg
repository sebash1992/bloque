<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 760" width="100%" height="100%">
  <style>
    .tit-b { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
    .sub-b { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #64748B; letter-spacing: 1px; }
    .ex-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #F8FAFC; }
  </style>

  <!-- Marco Celular -->
  <rect width="350" height="760" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  
  <!-- HEADER -->
  <g transform="translate(24, 46)">
    <text x="0" y="20" fill="#64748B" font-size="18" font-weight="bold" cursor="pointer">✕</text>
    <text x="32" y="18" class="tit-b">Nuevo Bloque Reutilizable</text>
    <text x="302" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="end">Guardar</text>
  </g>

  <!-- INPUT: NOMBRE DEL BLOQUE -->
  <g transform="translate(24, 100)">
    <text x="0" y="-6" class="sub-b">📛 NOMBRE DEL BLOQUE (BIBLIOTECA)</text>
    <rect width="302" height="40" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="24" font-family="sans-serif" font-size="13" fill="#F8FAFC">Bloque Fuerza Pecho/Bíceps</text>
  </g>

  <!-- CONFIGURACIÓN DE SERIES GENERALES -->
  <g transform="translate(24, 170)">
    <text x="0" y="-6" class="sub-b">🔄 SERIES DEL CIRCUITO</text>
    <rect width="50" height="36" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="25" y="22" font-family="monospace" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">4</text>
    <text x="64" y="22" font-family="sans-serif" font-size="13" fill="#94A3B8">vueltas / series por ejercicio</text>
  </g>

  <!-- LISTA DE EJERCICIOS CONECTADOS -->
  <g transform="translate(24, 240)">
    <text x="0" y="0" class="sub-b">🏋️ EJERCICIOS DEL BLOQUE</text>
    
    <!-- Ejercicio 1 -->
    <g transform="translate(0, 10)">
      <rect width="302" height="50" rx="10" fill="#1E293B"/>
      <text x="14" y="22" class="ex-title">1. Press plano c/barra</text>
      <text x="14" y="38" font-family="sans-serif" font-size="11" fill="#64748B">Reps: 10-8-6-4</text>
      <text x="288" y="30" fill="#EF4444" font-size="12" text-anchor="end">✕</text>
    </g>

    <!-- Ejercicio 2 -->
    <g transform="translate(0, 68)">
      <rect width="302" height="50" rx="10" fill="#1E293B"/>
      <text x="14" y="22" class="ex-title">2. Bicep concentrado</text>
      <text x="14" y="38" font-family="sans-serif" font-size="11" fill="#64748B">Reps: 8/8</text>
      <text x="288" y="30" fill="#EF4444" font-size="12" text-anchor="end">✕</text>
    </g>

    <!-- BOTÓN AGREGAR EJERCICIO LOCAL AL BLOQUE -->
    <g transform="translate(0, 126)">
      <rect width="302" height="40" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>
      <text x="151" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94A3B8" text-anchor="middle">+ Vincular Ejercicio</text>
    </g>
  </g>
</svg>
