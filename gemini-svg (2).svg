<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 760" width="100%" height="100%">
  <style>
    .titulo-home { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; }
    .sub-home { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #64748B; letter-spacing: 1px; }
    .card-title-home { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #F8FAFC; }
    .card-desc-home { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
    .nav-txt-home { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; text-anchor: middle; }
    .nav-txt-active-home { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #10B981; text-anchor: middle; }
  </style>

  <rect width="350" height="760" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  
  <g transform="translate(24, 46)">
    <text x="0" y="20" class="titulo-home">¡Hola, Sebastian! 👋</text>
    <text x="0" y="38" font-family="sans-serif" font-size="12" fill="#64748B">Listo para tu sesión de hoy.</text>
  </g>

  <text x="24" y="124" class="sub-home">📅 ESTA SEMANA</text>
  <g transform="translate(24, 138)">
    <rect width="302" height="54" rx="12" fill="#1E293B"/>
    <circle cx="30" cy="20" r="14" fill="#10B981"/>
    <text x="30" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">L</text>
    <text x="30" y="44" font-family="sans-serif" font-size="9" fill="#10B981" font-weight="bold" text-anchor="middle">✓</text>
    <circle cx="90" cy="20" r="14" fill="#10B981"/>
    <text x="90" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">M</text>
    <text x="90" y="44" font-family="sans-serif" font-size="9" fill="#10B981" font-weight="bold" text-anchor="middle">✓</text>
    <circle cx="150" cy="20" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="150" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">J</text>
    <text x="150" y="44" font-family="sans-serif" font-size="8" fill="#10B981" font-weight="bold" text-anchor="middle">HOY</text>
    <circle cx="210" cy="20" r="14" fill="#0F172A"/>
    <text x="210" y="24" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">V</text>
    <circle cx="270" cy="20" r="14" fill="#0F172A" stroke="#334155" stroke-dasharray="2"/>
    <text x="270" y="24" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">S</text>
  </g>

  <text x="24" y="228" class="sub-home">🏋️ PRÓXIMO ENTRENAMIENTO</text>
  <g transform="translate(24, 242)">
    <rect width="302" height="120" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="32" class="card-title-home" font-size="16">DÍA 1: Tren Superior + Zona Media</text>
    <text x="20" y="52" class="card-desc-home">Te toca: Press plano, Bíceps, Jalón y Core[cite: 5].</text>
    <text x="20" y="68" class="card-desc-home" fill="#64748B">Duración estimada: 50 min</text>
    
    <rect x="20" y="82" width="262" height="26" rx="8" fill="#10B981"/>
    <text x="151" y="99" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">🚀 EMPEZAR SESIÓN NOW</text>
  </g>

  <text x="24" y="398" class="sub-home">📊 LOGROS DE LA TEMPORADA</text>
  <g transform="translate(24, 412)">
    <rect width="144" height="74" rx="12" fill="#1E293B"/>
    <text x="16" y="26" font-family="sans-serif" font-size="20" font-weight="bold" fill="#10B981">4 semanas</text>
    <text x="16" y="48" class="card-desc-home">Racha perfecta 🔥</text>
    
    <rect x="158" width="144" height="74" rx="12" fill="#1E293B"/>
    <text x="174" y="26" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">12.5 ton</text>
    <text x="174" y="48" class="card-desc-home">Levantadas en total 📈</text>
  </g>

  <g transform="translate(24, 502)">
    <rect width="302" height="54" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="32" class="card-title-home" font-size="13">🏆 Último Récord Personal</text>
    <text x="286" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="end">82.5 kg</text>
    <text x="16" y="46" class="card-desc-home" font-size="10">En Press plano c/barra (Serie de 4 reps)[cite: 5].</text>
  </g>

  <g transform="translate(0, 700)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="58" y="24" font-size="16">🏠</text>
    <text x="58" y="38" class="nav-txt-active-home">Inicio</text>
    
    <text x="175" y="24" font-size="16">🏋️</text>
    <text x="175" y="38" class="nav-txt-home">Mi Rutina</text>
    
    <text x="292" y="24" font-size="16">📊</text>
    <text x="292" y="38" class="nav-txt-home">Progreso</text>
  </g>
</svg>
