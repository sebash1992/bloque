<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 760" width="100%" height="100%">
  <style>
    .tit-r { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
    .sub-r { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #64748B; letter-spacing: 1px; }
    .inp-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #F8FAFC; }
  </style>

  <!-- Marco Celular -->
  <rect width="350" height="760" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  
  <!-- HEADER -->
  <g transform="translate(24, 46)">
    <text x="0" y="20" fill="#64748B" font-size="18" font-weight="bold" cursor="pointer">✕</text>
    <text x="32" y="18" class="tit-r">Nueva Rutina (1/2)</text>
  </g>

  <!-- INPUT 1: NOMBRE -->
  <g transform="translate(24, 110)">
    <text x="0" y="-8" class="sub-r">🏷️ NOMBRE DEL PLAN</text>
    <rect width="302" height="44" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="16" y="26" class="inp-txt">Sinapsis Gym &amp; Fitness</text>
  </g>

  <!-- INPUT 2: FRECUENCIA -->
  <g transform="translate(24, 190)">
    <text x="0" y="-8" class="sub-r">📅 FRECUENCIA</text>
    <rect width="302" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" class="inp-txt" fill="#94A3B8">3 veces x semana + Bonus Track</text>
  </g>

  <!-- SELECCIÓN DE ICONO / COLOR PARA LA TARJETA -->
  <g transform="translate(24, 270)">
    <text x="0" y="-8" class="sub-r">🎨 COLOR E IDENTIFICADOR</text>
    <circle cx="20" cy="24" r="20" fill="#10B981"/>
    <text x="20" y="29" font-size="16" text-anchor="middle">⚡</text>
    
    <circle cx="70" cy="24" r="20" fill="#1E293B" stroke="#334155"/>
    <text x="70" y="29" font-size="16" text-anchor="middle">🔥</text>

    <circle cx="120" cy="24" r="20" fill="#1E293B" stroke="#334155"/>
    <text x="120" y="29" font-size="16" text-anchor="middle">💪</text>
  </g>

  <!-- BOTÓN SIGUIENTE -->
  <g transform="translate(24, 660)">
    <rect width="302" height="48" rx="14" fill="#10B981"/>
    <text x="151" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Continuar a los Días →</text>
  </g>
</svg>
