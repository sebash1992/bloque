      <circle cx="24" cy="25" r="14" fill="#334155"/>
      <text x="24" y="29" font-size="12" text-anchor="middle">💪</text>
      <text x="50" y="22" class="name-s">@juan.fit</text>
      <text x="50" y="38" class="desc-s">Último entreno: Hoy</text>
      <text x="268" y="30" fill="#64748B" font-size="14" text-anchor="end">🔗</text> </g>
    <g transform="translate(24, 294)">
      <rect width="282" height="50" rx="10" fill="#1E293B"/>
      <circle cx="24" cy="25" r="14" fill="#334155"/>
      <text x="24" y="29" font-size="12" text-anchor="middle">🤸</text>
      <text x="50" y="22" class="name-s">@profe.sinapsis</text>
      <text x="50" y="38" class="desc-s">Entrenador Vinculado</text>
      <text x="268" y="30" fill="#10B981" font-size="14" text-anchor="end">🔗</text>
    </g>

    <g transform="translate(0, 660)">
