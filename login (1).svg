      <text x="41" y="22" font-size="14">🏠</text><text x="41" y="36" class="nav-inactive">Inicio</text>
      <text x="123" y="22" font-size="14">🏋️</text><text x="123" y="36" class="nav-inactive">Rutinas</text>
      <text x="205" y="22" font-size="14">📊</text><text x="205" y="36" class="nav-inactive">Progreso</text>
