      <rect x="145" y="10" width="40" height="4" rx="2" fill="#475569"/>
      
      <text x="165" y="44" class="tit-s" text-anchor="middle">Sincronizá tu Progreso 🚀</text>
      <text x="165" y="66" class="desc-s" text-anchor="middle">Crea una cuenta gratis para respaldar tus marcas</text>
