      <text x="282" y="16" font-family="monospace" font-size="12" font-weight="bold" fill="#10B981" text-anchor="end">@seba.herrera</text>
      <line x1="0" y1="30" x2="282" y2="30" stroke="#1E293B" stroke-width="2"/>
    </g>

    <text x="24" y="104" class="sub-s">📥 RUTINAS RECIBIDAS</text>
    <g transform="translate(24, 118)">
