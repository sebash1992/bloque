        <text x="141" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" text-anchor="middle">🍏 Continuar con Apple</text>
      </g>
      
      <text x="165" y="260" class="desc-s" font-weight="bold" fill="#64748B" text-anchor="middle" cursor="pointer">Seguir usando modo local offline</text>
    </g>
