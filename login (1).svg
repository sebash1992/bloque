<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="100%" height="100%">
  <style>
    .tit-s { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
    .sub-s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #64748B; letter-spacing: 1px; }
    .name-s { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #F8FAFC; }
    .desc-s { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
    .nav-active { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #10B981; text-anchor: middle; }
    .nav-inactive { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; text-anchor: middle; }
  </style>

  <g transform="translate(20, 0)">
    <rect width="330" height="720" rx="36" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    
    <g transform="translate(24, 40)">
