      <text x="200" y="48" class="desc-s" fill="#EF4444" font-weight="bold">Rechazar</text>
    </g>

    <text x="24" y="218" class="sub-s">👥 MIS CONTACTOS</text>
    <g transform="translate(24, 232)">
